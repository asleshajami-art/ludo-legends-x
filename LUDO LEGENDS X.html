</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
const {useState,useRef,useEffect}=React,h=React.createElement,U=100/15;

// ---- game rules ----
// token pos: -1 yard, 0..50 ring (relative to own start), 51..55 home column, 56 finished
function xy(col,i,p){if(p<0){const[o,c]=YO[col];return[o+2+(i>>1)*2,c+2+(i&1)*2]}

 return{players,tok,turn:0,dice:0,phase:'roll',moves:[],sixes:0,busy:false,over:false,winner:null,dead:false,msg:`${players[0].name} starts — roll the dice!`}}
function aiPick(g){const col=g.players[g.turn].color,d=g.dice;let best=g.moves[0],bs=-1e9;
 g.moves.forEach(i=>{const p=g.tok[col][i],np=p<0?0:p+d;let s=np+Math.random()*3;if(p<0)s+=30;if(np===56)s+=60;
  if(np<=50){const a=(START[col]+np)%52;if(SAFE.includes(a))s+=12;else Object.keys(g.tok).forEach(o=>{if(o!==col)g.tok[o].forEach(q=>{if(q<0||q>50)return;const oa=(START[o]+q)%52;if(oa===a)s+=70;else if((a-oa+52)%52<=6)s-=14})})}
  if(s>bs){bs=s;best=i}});return best}
// ---- UI pieces ----
function Dice({v,rolling}){const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v||1];
 return h('div',{className:'dice'+(rolling?' roll':''),role:'img','aria-label':'Dice '+(v||'')},[...Array(9)].map((_,i)=>h('b',{key:i,className:P.includes(i)?'on':''})))}
function Board({g,onTok}){const cells=[];
 PATH.forEach(([r,c],k)=>{const o=ORDER.find(x=>START[x]===k);cells.push(h('div',{key:'r'+k,className:'cell',style:{left:c*U+'%',top:r*U+'%',background:o?COL[o]:'#f2f5ff'}},SAFE.includes(k)?'★':''))});
 ORDER.forEach(o=>HOME[o].forEach(([r,c],k)=>cells.push(h('div',{key:o+'h'+k,className:'cell',style:{left:c*U+'%',top:r*U+'%',background:COL[o],opacity:.85}}))));
 const yards=ORDER.map(o=>h('div',{key:'y'+o,className:'yard',style:{left:YO[o][1]*U+'%',top:YO[o][0]*U+'%',background:COL[o]}},h('div',{className:'yp'},[0,1,2,3].map(i=>h('i',{key:i,style:{background:COL[o]}})))));
 const cur=g.players[g.turn],all=[],cnt={};
 g.players.forEach(p=>g.tok[p.color].forEach((pos,i)=>{const[y,x]=xy(p.color,i,pos),k=pos<0?null:y+','+x;all.push({p,i,pos,y,x,k});if(k)cnt[k]=(cnt[k]||0)+1}));
 const seen={};
 const toks=all.map(t=>{let ox=0,oy=0;if(t.k&&cnt[t.k]>1){const n=seen[t.k]=(seen[t.k]||0)+1,a=n/cnt[t.k]*6.283;ox=Math.cos(a)*.2;oy=Math.sin(a)*.2}
  const can=g.phase==='move'&&!cur.ai&&cur.color===t.p.color&&g.moves.includes(t.i),c=t.p.color;
  return h('button',{key:c+t.i,className:'tok'+(can?' can':''),disabled:!can,onClick:()=>onTok(t.i),'aria-label':`${c} token ${t.i+1}`,
   style:{left:(t.x+ox)*U+'%',top:(t.y+oy)*U+'%',zIndex:can?50:10+t.pos,background:`radial-gradient(circle at 35% 30%,#fffa,${COL[c]} 55%,#0007)`}},t.i+1)});
 return h('div',{className:'board'},cells,yards,h('div',{className:'ctr'}),toks)}
function Confetti(){const r=useRef([...Array(60)].map(()=>({l:Math.random()*100,d:Math.random()*2,t:2+Math.random()*2.5,c:Object.values(COL)[Math.random()*4|0]})));
 return r.current.map((p,i)=>h('div',{key:i,className:'cf',style:{left:p.l+'%',background:p.c,animationDuration:p.t+'s',animationDelay:p.d+'s'}}))}
// ---- game screen ----
function Game({players,mode,onExit,onEnd}){
 const[,tk]=useState(0),up=()=>tk(n=>n+1),R=useRef(null);if(!R.current)R.current=newGame(players);const g=R.current;
 useEffect(()=>()=>{R.current.dead=true},[]);
 const next=extra=>{if(!extra){g.turn=(g.turn+1)%g.players.length;g.sixes=0}g.phase='roll';g.busy=false;g.moves=[];const p=g.players[g.turn];
  g.msg=extra?`${p.name} rolls again!`:`${p.name}'s turn — ${p.ai?'thinking…':'roll the dice'}`;up()};
 const roll=async()=>{if(g.busy||g.phase!=='roll'||g.over)return;g.busy=true;g.phase='rolling';
  for(let k=0;k<9;k++){g.dice=1+(Math.random()*6|0);sfx(200+k*30,.03);up();await sleep(65);if(g.dead)return}
  const v=1+(Math.random()*6|0),p=g.players[g.turn];g.dice=v;g.sixes=v===6?g.sixes+1:0;
  if(g.sixes===3){g.msg=`${p.name} rolled three 6s — turn lost!`;up();await sleep(1100);if(g.dead)return;return next(false)}
  g.moves=legalMoves(g,p.color,v);
  if(!g.moves.length){g.msg=`${p.name} rolled ${v} — no legal moves.`;up();await sleep(1000);if(g.dead)return;return next(false)}
  g.msg=`${p.name} rolled ${v}. ${p.ai?'':'Tap a glowing token to move.'}`;g.phase='move';g.busy=false;up()};
 const doMove=async i=>{if(g.busy||g.phase!=='move'||!g.moves.includes(i))return;g.busy=true;g.phase='anim';
  const p=g.players[g.turn],col=p.color,t=g.tok[col];let extra=g.dice===6,cap=false;g.moves=[];
  if(t[i]<0){t[i]=0;sfx(660);up();await sleep(CFG.speed)}
  else for(let s=0;s<g.dice;s++){t[i]++;sfx(420+t[i]*4,.06);up();await sleep(CFG.speed);if(g.dead)return}
  if(g.dead)return;
  if(t[i]<=50){const a=(START[col]+t[i])%52;if(!SAFE.includes(a))Object.keys(g.tok).forEach(o=>{if(o!==col)g.tok[o].forEach((q,j)=>{if(q>=0&&q<=50&&(START[o]+q)%52===a){g.tok[o][j]=-1;cap=true}})})}
  if(cap){extra=true;sfx(150,.35,'sawtooth')}
  if(t[i]===56){extra=true;sfx(880,.3)}
  if(t.every(x=>x===56)){g.over=true;g.winner=p;g.phase='over';g.busy=false;sfx(990,.5);onEnd(!p.ai);up();return}

  h('div',{className:'game'},
   h('div',{className:'bw'},h(Board,{g,onTok:doMove})),
   h('div',{className:'side'},
    g.players.map(p=>h('div',{key:p.color,className:'pc'+(p===cur&&!g.over?' act':''),style:{'--c':COL[p.color]}},h('b'),p.name+(p.ai?' 🤖':''),h('span',null,g.tok[p.color].filter(x=>x===56).length+'/4 home'))),
    h('div',{className:'card'},h('div',{className:'row'},h(Dice,{v:g.dice,rolling:g.phase==='rolling'}),
      h('button',{className:'btn gold',disabled:!humanTurn,onClick:roll},humanTurn?'🎲 Roll dice':cur.ai?'CPU turn…':'Please wait…')),
     h('div',{className:'msg',role:'status','aria-live':'polite'},g.msg),
     h('div',{style:{opacity:.75,fontSize:14}},g.phase==='move'?'Legal moves: token '+g.moves.map(i=>i+1).join(', '):'6 = enter a token & roll again · capture or reach home = bonus roll')),
    h('div',{className:'row'},h('button',{className:'btn ghost',onClick:restart},'↻ Restart'),h('button',{className:'btn ghost',onClick:onExit},'⌂ Menu'),
     h('button',{className:'btn ghost',onClick:()=>{CFG.sound=!CFG.sound;up()}},CFG.sound?'🔊':'🔇')))),
  g.over&&h('div',{className:'win'},h(Confetti),h('div',{className:'card'},h('div',{style:{fontSize:56}},'🏆'),
   h('h2',{className:'logo',style:{fontSize:28}},g.winner.name+' wins!'),h('p',null,mode==='cpu'?(g.winner.ai?'The computer took this one. Rematch?':'Legendary play!'):'Congratulations!'),
   h('div',{className:'row',style:{justifyContent:'center'}},h('button',{className:'btn gold',onClick:restart},'Play again'),h('button',{className:'btn ghost',onClick:onExit},'Menu')))))}
// ---- app shell ----
const Back=({go})=>h('button',{className:'btn ghost',style:{marginTop:14},onClick:()=>go('home')},'← Back');
function Setup({mode,go,start}){const cpu=mode==='cpu',opts=cpu?[1,2,3]:[2,3,4],[n,setN]=useState(opts[opts.length-1]);

  h('p',null,cpu?'You play Red. How many computer opponents?':'Pass the device around. How many players?'),
  h('div',{className:'row'},opts.map(o=>h('button',{key:o,className:'chip'+(o===n?' on':''),onClick:()=>setN(o)},o+(cpu?' CPU':' players')))),
  h('button',{className:'btn gold',style:{width:'100%'},onClick:()=>start(mode,n)},'Start game'),h(Back,{go}))}
function App(){
 const[scr,setScr]=useState('home'),[,tk]=useState(0),[game,setGame]=useState(null),refresh=()=>tk(n=>n+1);
 const load=()=>{try{return{name:'Player',wins:0,games:0,...JSON.parse(localStorage.getItem('llx')||'{}')}}catch(e){return{name:'Player',wins:0,games:0}}};
 const[prof,setProf]=useState(load),save=f=>setProf(p=>{const n=f(p);try{localStorage.setItem('llx',JSON.stringify(n))}catch(e){}return n});
 const start=(mode,n)=>{const cs=SETS[mode==='cpu'?n+1:n],pl=cs.map((c,i)=>({color:c,ai:mode==='cpu'&&i>0,name:mode==='cpu'?(i?'CPU '+AIN[i-1]:prof.name||'You'):'Player '+(i+1)}));setGame({mode,pl,key:Date.now()});setScr('game')};
 const orbs=[['#7c3aed','-80px','-60px'],['#2f6bff','60%','55%'],['#ffc933','75%','-120px']].map((o,i)=>h('div',{key:i,className:'orb',style:{width:320,height:320,background:o[0],left:o[1],top:o[2],animationDelay:i*2+'s'}}));
 let body;
 if(scr==='game'&&game)return h('div',null,orbs,h(Game,{key:game.key,players:game.pl,mode:game.mode,onExit:()=>setScr('home'),onEnd:won=>{if(game.mode==='cpu')save(p=>({...p,games:p.games+1,wins:p.wins+(won?1:0)}))}}));
 const home=[['▶','Play Now',()=>start('cpu',3),'gold'],['🤖','Play with Computer',()=>setScr('cpu')],['👥','Local Multiplayer',()=>setScr('local')],['📖','How to Play',()=>setScr('how')],['🧑‍🚀','Player Profile',()=>setScr('prof')],['⚙️','Settings',()=>setScr('set')],[CFG.sound?'🔊':'🔇','Sound: '+(CFG.sound?'On':'Off'),()=>{CFG.sound=!CFG.sound;sfx(600);refresh()},'ghost']];
 if(scr==='home')body=[h('div',{className:'menu',key:'m'},home.map(b=>h('button',{key:b[1],className:'btn '+(b[3]||''),onClick:b[2]},b[0]+' '+b[1])))];
 else if(scr==='cpu'||scr==='local')body=h(Setup,{mode:scr,go:setScr,start});
 else if(scr==='how')body=h('div',{className:'card panel'},h('h2',null,'How to play'),h('ul',null,
  ['Roll the dice on your turn. Roll a 6 to bring a token out of your yard.','Tap a glowing token to move it that many steps clockwise. Only glowing tokens are legal.','Land on an opponent’s token to send it back to its yard — unless it sits on a ★ safe cell or a coloured start cell.','A 6, a capture, or getting a token home gives you another roll. Three 6s in a row lose your turn.','Each token must travel all the way round, up your coloured home column, and finish with an exact roll.','Get all four tokens home first to win.'].map((t,i)=>h('li',{key:i},t))),h(Back,{go:setScr}));
